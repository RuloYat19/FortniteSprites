name: CI/CD Sprits de Fortnite

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  TAG: ${{ github.sha }}
  SA_PASSWORD: ${{ secrets.SA_PASSWORD || 'YourStrong!Passw0rd' }}

jobs:
  # JOB 1: TESTING (Backend Python)
  test:
    name: 1. Testing Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Instalar dependencias del backend
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Ejecutar pruebas unitarias
        working-directory: ./backend
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml
        continue-on-error: true

      - name: Mostrar resumen de pruebas
        run: |
          echo "✅ Pruebas ejecutadas. Reporte de cobertura disponible en coverage.xml"

  # JOB 2: BUILD AND PUSH A DOCKER HUB
  build-and-push:
    name: 2. Build and Push a DockerHub
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y subir imagen del Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-app:latest
            ${{ secrets.DOCKER_USERNAME }}/backend-app:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir y subir imagen del Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend-app:latest
            ${{ secrets.DOCKER_USERNAME }}/frontend-app:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar imágenes publicadas
        run: |
          echo "✅ Imágenes subidas a DockerHub:"
          echo "  📦 ${{ secrets.DOCKER_USERNAME }}/backend-app:latest"
          echo "  📦 ${{ secrets.DOCKER_USERNAME }}/backend-app:${{ env.TAG }}"
          echo "  📦 ${{ secrets.DOCKER_USERNAME }}/frontend-app:latest"
          echo "  📦 ${{ secrets.DOCKER_USERNAME }}/frontend-app:${{ env.TAG }}"

  # JOB 3: DEPLOY SIMULADO
  deploy-simulated:
    name: 3. Deploy Simulado (solo main)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Generar archivo .env para el despliegue
        run: |
          cat > .env << EOF
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          TAG=${{ env.TAG }}
          SA_PASSWORD=${{ env.SA_PASSWORD }}
          EOF

      - name: Descargar imágenes desde DockerHub
        run: docker compose -f docker-compose.prod.yml pull

      - name: Levantar servicios con docker compose
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Esperar que el backend esté saludable
        run: |
          echo "⏳ Esperando que el backend esté listo..."
          for i in {1..30}; do
            STATUS=$(docker compose -f docker-compose.prod.yml ps backend | grep -o 'healthy' || echo 'not ready')
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ Backend saludable en el intento $i"
              break
              sleep 5
            fi
            echo "⏳ Intento $i/30 - estado: $STATUS"
            sleep 5
          done

      - name: Verificar salud del Backend
        run: |
          if docker compose -f docker-compose.prod.yml exec -T backend curl -f -s http://localhost:8000/health; then
            echo "✅ Backend respondiendo correctamente"
          else
            echo "❌ Backend no responde al healthcheck"
            docker compose -f docker-compose.prod.yml logs backend
            exit 1
          fi

      - name: Verificar salud del Frontend
        run: |
          if docker compose -f docker-compose.prod.yml exec -T frontend curl -f -s http://localhost/health; then
            echo "✅ Frontend respondiendo correctamente"
          else
            echo "⚠️ Frontend no responde al healthcheck"
          fi

      - name: Probar endpoints del API
        run: |
          echo "📡 Probando endpoints del API..."
          echo "📋 Listando sprits..."
          docker compose -f docker-compose.prod.yml exec -T backend curl -s http://localhost:8000/api/sprits | head -c 500
          echo ""
          echo "✅ Pruebas de API completadas"

      - name: Resumen del despliegue
        run: |
          echo "=========================================="
          echo "🚀 DESPLIEGUE SIMULADO COMPLETADO"
          echo "=========================================="
          echo "Backend : ${{ secrets.DOCKER_USERNAME }}/backend-app:${{ env.TAG }}"
          echo "Frontend: ${{ secrets.DOCKER_USERNAME }}/frontend-app:${{ env.TAG }}"
          echo "=========================================="

      - name: Limpiar entorno
        if: always()
        run: docker compose -f docker-compose.prod.yml down

  # JOB 4: REPORTE FINAL
  report:
    name: 4. Resumen Final
    runs-on: ubuntu-latest
    needs: [test, build-and-push, deploy-simulated]
    if: always()

    steps:
      - name: Generar reporte del pipeline
        run: |
          echo "=========================================="
          echo "📊 REPORTE DEL PIPELINE CI/CD"
          echo "=========================================="
          echo "📌 Rama   : ${{ github.ref_name }}"
          echo "🔑 Commit : ${{ env.TAG }}"
          echo "👤 Autor  : ${{ github.actor }}"
          echo "=========================================="
          echo ""
          echo "📋 RESULTADOS:"
          
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "  ✅ TESTING       : OK"
          else
            echo "  ❌ TESTING       : FALLO"
          fi

          if [ "${{ needs.build-and-push.result }}" = "success" ]; then
            echo "  ✅ BUILD/PUSH    : OK"
          elif [ "${{ needs.build-and-push.result }}" = "skipped" ]; then
            echo "  ⏭️ BUILD/PUSH    : OMITIDO (solo en push a main/develop)"
          else
            echo "  ❌ BUILD/PUSH    : FALLO"
          fi

          if [ "${{ needs.deploy-simulated.result }}" = "success" ]; then
            echo "  ✅ DEPLOY        : OK"
          elif [ "${{ needs.deploy-simulated.result }}" = "skipped" ]; then
            echo "  ⏭️ DEPLOY        : OMITIDO (solo en push a main)"
          else
            echo "  ❌ DEPLOY        : FALLO"
          fi

          echo "=========================================="
          echo "🎯 Pipeline completado el: $(date)"
          echo "=========================================="